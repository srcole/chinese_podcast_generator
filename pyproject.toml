[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chinese-podcast-generator"
version = "0.1.0"
description = "Generate bilingual study podcasts from a folder of transcripts and vocabulary"
requires-python = ">=3.11"
dependencies = ["edge-tts>=7.2.0,<8"]

[project.optional-dependencies]
video = ["Pillow>=10,<13"]

[project.scripts]
chinese-podcast = "podcast_generator.cli:main"
chinese-podcast-video = "podcast_generator.video:main"

[tool.setuptools.packages.find]
include = ["podcast_generator*"]
