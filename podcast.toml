[voices]
chinese = "zh-CN-XiaoxiaoNeural"
english = "en-US-ChristopherNeural"

[rates]
chinese = "+0%"
english = "+80%"
chinese_slow = "-20%"

[pauses]
term_to_meaning = 0.01
between_entries = 0.5
between_sections = 1.5

[inputs]
vocabulary = "vocab_list.csv"
chinese = "transcript.txt"
english = "transcript_english.txt"

[podcast]
sections = ["vocabulary", "interleaved", "chinese_slow"]
# These are regular expressions matching entire production-note lines.
omit_lines = ['约\s*\d+\s*分钟播客单口文字稿', 'A roughly \d+-minute solo podcast script']
